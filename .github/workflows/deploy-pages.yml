name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f auth.css
          test -f styles.css
          test -f app.js
          test -f auth.js
          test -f runtime-config.js
          test -f sales-activity.css
          test -f sales-cycle.css
          test -f sales-history.js
          test -f sales-cycle.js
          test -f sales-flow.js
          test -f production.css
          test -f production.js
          test -f diagnostics.js

      - name: Build static site directory
        run: |
          rm -rf dist
          mkdir -p dist
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.svg' -o -name '*.png' -o -name '*.ico' \) -exec cp {} dist/ \;
          touch dist/.nojekyll

      - name: Validate generated files
        run: |
          test -s dist/index.html
          test -s dist/auth.css
          test -s dist/styles.css
          test -s dist/app.js
          test -s dist/auth.js
          test -s dist/runtime-config.js
          test -s dist/sales-activity.css
          test -s dist/sales-cycle.css
          test -s dist/sales-history.js
          test -s dist/sales-cycle.js
          test -s dist/sales-flow.js
          test -s dist/production.css
          test -s dist/production.js
          test -s dist/diagnostics.js

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: anix-dashboard-static-site
          path: dist
          if-no-files-found: error

  deploy:
    name: Publish to gh-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static site directory
        run: |
          rm -rf dist
          mkdir -p dist
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.svg' -o -name '*.png' -o -name '*.ico' \) -exec cp {} dist/ \;
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
