name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Deploy schema and Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Apply idempotent database migrations
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            supabase/migrations/20260722_120000_yougile_production.sql
            supabase/migrations/20260723_090000_dashboard_security.sql
            supabase/migrations/202608140001_anix_control.sql
            supabase/migrations/202608280001_ceo_operating_dashboard.sql
            supabase/migrations/202609030001_telegram_task_capture.sql
          )

          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            sql=$(cat "$migration")
            payload=$(jq -n --arg query "$sql" '{query:$query, read_only:false}')
            tmp_file=$(mktemp)

            http_code=$(curl --silent --show-error \
              --output "$tmp_file" \
              --write-out "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query")

            echo "Migration HTTP $http_code"
            cat "$tmp_file"
            echo
            rm -f "$tmp_file"

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              exit 1
            fi
          done

      - name: Configure optional Telegram task capture
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          YOUGILE_INBOX_COLUMN_ID: ${{ secrets.YOUGILE_INBOX_COLUMN_ID }}
          YOUGILE_DEFAULT_ASSIGNEE_IDS: ${{ secrets.YOUGILE_DEFAULT_ASSIGNEE_IDS }}
          YOUGILE_TASK_URL_TEMPLATE: ${{ secrets.YOUGILE_TASK_URL_TEMPLATE }}
          ANIX_LLM_GATEWAY_SECRET: ${{ secrets.ANIX_LLM_GATEWAY_SECRET }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Telegram task capture is not configured; skipping optional setup."
            exit 0
          fi
          test -n "$TELEGRAM_WEBHOOK_SECRET"
          test -n "$YOUGILE_INBOX_COLUMN_ID"
          test -n "$ANIX_LLM_GATEWAY_SECRET"
          case "$TELEGRAM_WEBHOOK_SECRET" in
            *[!A-Za-z0-9_-]*) echo "TELEGRAM_WEBHOOK_SECRET contains unsupported characters."; exit 1 ;;
          esac
          secret_args=(
            "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            "TELEGRAM_WEBHOOK_SECRET=$TELEGRAM_WEBHOOK_SECRET"
            "YOUGILE_INBOX_COLUMN_ID=$YOUGILE_INBOX_COLUMN_ID"
            "ANIX_LLM_GATEWAY_SECRET=$ANIX_LLM_GATEWAY_SECRET"
          )
          [ -z "$YOUGILE_DEFAULT_ASSIGNEE_IDS" ] || secret_args+=("YOUGILE_DEFAULT_ASSIGNEE_IDS=$YOUGILE_DEFAULT_ASSIGNEE_IDS")
          [ -z "$YOUGILE_TASK_URL_TEMPLATE" ] || secret_args+=("YOUGILE_TASK_URL_TEMPLATE=$YOUGILE_TASK_URL_TEMPLATE")
          [ -z "$TELEGRAM_ALLOWED_CHAT_IDS" ] || secret_args+=("TELEGRAM_ALLOWED_CHAT_IDS=$TELEGRAM_ALLOWED_CHAT_IDS")
          [ -z "$TELEGRAM_ALLOWED_USER_IDS" ] || secret_args+=("TELEGRAM_ALLOWED_USER_IDS=$TELEGRAM_ALLOWED_USER_IDS")
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" "${secret_args[@]}"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Register Telegram webhook
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Telegram task capture is not configured; webhook registration skipped."
            exit 0
          fi
          payload=$(jq -n \
            --arg url "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/telegram-task-bot" \
            --arg secret "$TELEGRAM_WEBHOOK_SECRET" \
            '{url:$url, secret_token:$secret, allowed_updates:["message","edited_message","message_reaction"], drop_pending_updates:false}')
          response=$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook")
          test "$(jq -r '.ok' <<<"$response")" = "true"
          echo "Telegram webhook registered."

      - name: Verify anonymous access is blocked
        shell: bash
        run: |
          set -euo pipefail
          functions=(source-status sales-summary sales-history sales-cycle production-summary control-center ceo-digest)
          for function_name in "${functions[@]}"; do
            tmp_file=$(mktemp)
            http_code=$(curl --silent --show-error \
              --output "$tmp_file" \
              --write-out "%{http_code}" \
              --connect-timeout 20 \
              --max-time 60 \
              "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/${function_name}")
            echo "${function_name}: HTTP ${http_code}"
            cat "$tmp_file"
            echo
            rm -f "$tmp_file"
            if [ "$http_code" != "401" ]; then
              echo "Expected HTTP 401 for anonymous request to ${function_name}."
              exit 1
            fi
          done
