name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Deploy schema and Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Apply idempotent database migrations
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            supabase/migrations/20260722_120000_yougile_production.sql
            supabase/migrations/20260723_090000_dashboard_security.sql
          )

          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            sql=$(cat "$migration")
            payload=$(jq -n --arg query "$sql" '{query:$query, read_only:false}')
            tmp_file=$(mktemp)

            http_code=$(curl --silent --show-error \
              --output "$tmp_file" \
              --write-out "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query")

            echo "Migration HTTP $http_code"
            cat "$tmp_file"
            echo
            rm -f "$tmp_file"

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              exit 1
            fi
          done

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify anonymous access is blocked
        shell: bash
        run: |
          set -euo pipefail
          functions=(source-status sales-summary sales-history sales-cycle production-summary)
          for function_name in "${functions[@]}"; do
            tmp_file=$(mktemp)
            http_code=$(curl --silent --show-error \
              --output "$tmp_file" \
              --write-out "%{http_code}" \
              --connect-timeout 20 \
              --max-time 60 \
              "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/${function_name}")
            echo "${function_name}: HTTP ${http_code}"
            cat "$tmp_file"
            echo
            rm -f "$tmp_file"
            if [ "$http_code" != "401" ]; then
              echo "Expected HTTP 401 for anonymous request to ${function_name}."
              exit 1
            fi
          done
